name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Backend, frontend and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # the pixel-avatar module is a private repository: PIXEL_AVATAR_TOKEN is a read-only token for it
      - name: Give npm access to the pixel-avatar repository
        run: git config --global url."https://x-access-token:${{ secrets.PIXEL_AVATAR_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Install the dependencies
        run: |
          npm ci --prefix backend
          npm ci

      - name: Backend tests
        run: npm run test:backend

      - name: Frontend unit tests
        run: npm run test:frontend

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      # screenshots, traces and the HTML report of the failed browser tests
      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        env:
          GITHUB_TOKEN: ${{ secrets.PIXEL_AVATAR_TOKEN }}
        run: docker build --secret id=github_token,env=GITHUB_TOKEN -t sudoku-game-web .

      - name: Start it and wait for the health check
        run: |
          docker run -d --name sudoku -p 3000:3000 sudoku-game-web
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' sudoku)" = "healthy" ]; then
              curl -fsS http://localhost:3000/api/health
              curl -fsS "http://localhost:3000/api/v1/puzzles?difficulty=easy" > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs sudoku
          exit 1
