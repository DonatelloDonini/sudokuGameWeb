services:
  sudoku:
    build: .
    image: sudoku-game-web
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # set to "true" when the game is served over HTTPS
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - sudoku-data:/app/data
    restart: unless-stopped

volumes:
  sudoku-data:
